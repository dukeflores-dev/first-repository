<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGradCloud)"/>

  <!-- Main Container -->
  <rect x="60" y="45" width="680" height="360" rx="16" fill="rgba(13, 20, 36, 0.85)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5"/>

  <!-- Top Bar -->
  <circle cx="85" cy="75" r="5" fill="#ef4444"/>
  <circle cx="102" cy="75" r="5" fill="#f59e0b"/>
  <circle cx="119" cy="75" r="5" fill="#10b981"/>
  <text x="145" y="80" fill="#94a3b8" font-size="13" font-family="monospace">k8s-mesh-orchestrator :: v2.4.0-prod</text>

  <!-- Left: Nodes Visualizer -->
  <rect x="85" y="105" width="310" height="275" rx="10" fill="#090e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="105" y="135" fill="#00f2fe" font-size="13" font-weight="700" font-family="sans-serif">CLUSTER TOPOLOGY (32 NODES)</text>

  <!-- Cluster Node Graphics -->
  <g transform="translate(105, 160)">
    <!-- Central Node -->
    <circle cx="140" cy="100" r="28" fill="url(#cyanBlueGrad)" fill-opacity="0.2" stroke="#00f2fe" stroke-width="2"/>
    <text x="140" y="105" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">MASTER</text>

    <!-- Satellite Nodes -->
    <line x1="140" y1="100" x2="60" y2="40" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="60" cy="40" r="18" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="60" y="44" fill="#10b981" font-size="9" text-anchor="middle" font-family="sans-serif">W-01</text>

    <line x1="140" y1="100" x2="220" y2="40" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="220" cy="40" r="18" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="220" y="44" fill="#10b981" font-size="9" text-anchor="middle" font-family="sans-serif">W-02</text>

    <line x1="140" y1="100" x2="60" y2="160" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="60" cy="160" r="18" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="60" y="164" fill="#10b981" font-size="9" text-anchor="middle" font-family="sans-serif">W-03</text>

    <line x1="140" y1="100" x2="220" y2="160" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="220" cy="160" r="18" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="220" y="164" fill="#00f2fe" font-size="9" text-anchor="middle" font-family="sans-serif">W-04</text>
  </g>

  <!-- Right: Metrics Terminal -->
  <rect x="415" y="105" width="295" height="275" rx="10" fill="#090e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="435" y="135" fill="#a855f7" font-size="13" font-weight="700" font-family="sans-serif">TELEMETRY &amp; SLI / SLO</text>

  <g transform="translate(435, 160)" font-family="monospace" font-size="11">
    <text x="0" y="0" fill="#94a3b8">▶ Uptime SLA: <tspan fill="#10b981" font-weight="bold">99.995%</tspan></text>
    <text x="0" y="24" fill="#94a3b8">▶ Request Rate: <tspan fill="#ffffff">84,200 req/s</tspan></text>
    <text x="0" y="48" fill="#94a3b8">▶ P99 Latency: <tspan fill="#00f2fe">4.2ms</tspan></text>
    <text x="0" y="72" fill="#94a3b8">▶ Autoscaling Pods: <tspan fill="#ffffff">128 active</tspan></text>

    <!-- Mini Progress Bars -->
    <rect x="0" y="95" width="255" height="6" rx="3" fill="#1e293b"/>
    <rect x="0" y="95" width="210" height="6" rx="3" fill="url(#cyanBlueGrad)"/>

    <text x="0" y="125" fill="#64748b">[INFO] Healthcheck passed on all edge nodes.</text>
    <text x="0" y="145" fill="#10b981">[SUCCESS] Zero packet drop recorded.</text>
  </g>
</svg>

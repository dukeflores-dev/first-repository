<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d1a"/>
      <stop offset="50%" stop-color="#071828"/>
      <stop offset="100%" stop-color="#092230"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102538" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0c1b2b" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid lines -->
  <g stroke="rgba(0, 242, 254, 0.05)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Main Card -->
  <rect x="60" y="45" width="680" height="360" rx="16" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>
  
  <!-- Card Header -->
  <circle cx="95" cy="80" r="14" fill="#10b981" fill-opacity="0.2"/>
  <text x="95" y="85" fill="#10b981" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">◈</text>
  <text x="125" y="86" fill="#f8fafc" font-size="18" font-weight="700" font-family="sans-serif">NexusPay &amp; Crypto Gateway</text>
  <rect x="610" y="68" width="100" height="26" rx="13" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
  <text x="660" y="85" fill="#10b981" font-size="11" font-weight="600" text-anchor="middle" font-family="sans-serif">● LIVE TXNS</text>

  <!-- Balance Block -->
  <rect x="95" y="125" width="280" height="120" rx="12" fill="#081421" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="120" y="155" fill="#94a3b8" font-size="12" font-family="sans-serif">TOTAL ASSETS VALUE</text>
  <text x="120" y="195" fill="#ffffff" font-size="28" font-weight="800" font-family="sans-serif">$248,920.45</text>
  <text x="120" y="225" fill="#10b981" font-size="13" font-weight="600" font-family="sans-serif">+ 18.4% (Last 30d)</text>

  <!-- Mini Chart -->
  <rect x="400" y="125" width="305" height="120" rx="12" fill="#081421" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <path d="M 420 210 Q 460 190, 490 200 T 560 160 T 630 145 T 685 140" fill="none" stroke="url(#emeraldGrad)" stroke-width="3" filter="url(#glow)"/>
  <path d="M 420 210 Q 460 190, 490 200 T 560 160 T 630 145 T 685 140 L 685 230 L 420 230 Z" fill="url(#emeraldGrad)" fill-opacity="0.1"/>

  <!-- Transaction List Rows -->
  <g transform="translate(95, 270)">
    <rect width="610" height="42" rx="8" fill="#0b1a29" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <circle cx="24" cy="21" r="10" fill="#10b981" fill-opacity="0.2"/>
    <text x="24" y="25" fill="#10b981" font-size="10" text-anchor="middle" font-family="sans-serif">ETH</text>
    <text x="50" y="26" fill="#f8fafc" font-size="13" font-weight="600" font-family="sans-serif">Smart Contract Settlement</text>
    <text x="580" y="26" fill="#10b981" font-size="13" font-weight="700" text-anchor="end" font-family="sans-serif">+ 4.50 ETH</text>
  </g>

  <g transform="translate(95, 325)">
    <rect width="610" height="42" rx="8" fill="#0b1a29" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <circle cx="24" cy="21" r="10" fill="#00f2fe" fill-opacity="0.2"/>
    <text x="24" y="25" fill="#00f2fe" font-size="10" text-anchor="middle" font-family="sans-serif">USD</text>
    <text x="50" y="26" fill="#f8fafc" font-size="13" font-weight="600" font-family="sans-serif">Global Wire Transfer (SWIFT)</text>
    <text x="580" y="26" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="end" font-family="sans-serif">-$12,450.00</text>
  </g>
</svg>
